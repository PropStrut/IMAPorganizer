# IMAPorganizer.sample.ini
# `IMAPorganizer.sample.ini` is a sample config file with placeholder accounts. 
# Copy it to `IMAPorganizer.ini` if you don't already have that .ini file.
#
# Lives in the same folder as the IMAPorganizer.py script.
# Lines starting with # are comments. Put comments on their own lines only.
# Passwords are NEVER stored in this file; the script prompts for them.

# ---------------------------------------------------------------------------
# Global settings (defaults used by every account, no per account overrides)
# ---------------------------------------------------------------------------
[global]

# Default answer to the dry-run prompt (yes = dry-run, nothing is changed).
# The --dry-run and --live command-line switches skip the prompt entirely.
dry_run_default = yes

# Log file. A bare name is created in the same folder as the script.
log_file = IMAPorganizer.log

# Log level: NONE, INFO, or DEBUG
log_level = INFO

# Screen output: quiet (errors only), summary, or verbose (every message)
screen_output = summary

# ---------------------------------------------------------------------------
# More global settings (defaults used by every account unless an account overrides)
# ---------------------------------------------------------------------------

# Folder to scan for messages to move.
source_folder = INBOX

# Folder that matched messages are moved into, for review in your email client.
review_folder = IMAPorganizer

# Keep recent mail in place. Matching messages RECEIVED on or after this day
# are never moved; only older ones may be. Choices:
#   now              no age limit: every match is eligible (the default)
#   30d  2w  3m  1y  that long ago (days, weeks, months, years)
#   2026-08-04       an exact date (YYYY-MM-DD)
# The script shows the exact date it works out. At run time you are asked,
# and this value is the default answer. Command line: --keep 3m
# An account can override this with its own keep_recent.
keep_recent = now

# Keep flagged messages in place (Roundcube: "Flagged", Thunderbird: "Starred").
#   yes   flagged messages are never moved (the default)
#   no    flagged messages are treated like any other
# At run time you are asked, and this value is the default answer.
# Command line: --keep-flagged or --move-flagged
# An account can override this with its own keep_flagged.
keep_flagged = yes

# ---------------------------------------------------------------------------
# Accounts
#
# Each account is a section whose name is the email address.
# The script lists accounts in the order they appear here; the first one
# is the default choice at the account prompt.
#
# Required:  server, senders
# Optional:  port, username, source_folder, review_folder,
#            keep_recent, keep_flagged
#
# port:      if omitted, 993 is used. 993 = TLS from the start,
#            143 = STARTTLS. Other ports are treated as TLS.
# username:  if omitted, the email address (the section name) is used.
# source_folder / review_folder: if omitted, the [global] values are used.
# keep_recent / keep_flagged: if omitted, the [global] values are used. Set
#            them here to give one account its own default answers (same
#            choices as in [global]). Command-line switches still win.
#
# senders:   The senders to filter on. Any message in the source folder whose
#            From address matches an entry here is moved to the review folder.
#            One entry per line, indented under "senders =".
#            Case-insensitive. Matches the From address only.
#              someone@example.com   exactly this address
#              *@example.com         any address at exactly example.com
#                                    (subdomains are NOT matched)
# ---------------------------------------------------------------------------

[person@example.com]
server = mail.example.com
senders =
    *@example.com
    news@example.com

[other.person@example.net]
server = mailserver.example.net
port = 143
username = otherperson
source_folder = INBOX
review_folder = ToReview
keep_recent = 10y
keep_flagged = yes
senders =
    *@example.net
    sales@example.net

